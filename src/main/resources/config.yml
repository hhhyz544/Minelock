premium:
  # Checks Mojang's profile API by player name. A found profile is recorded as a
  # premium name. It is only treated as verified when the login UUID equals the
  # Mojang UUID, which normally requires online-mode or secure proxy forwarding.
  detect: true
  auto-login-verified: true
  # Unsafe compatibility mode for offline-mode servers. When enabled, a premium
  # name found through Mojang's API will use the Mojang UUID even if the server
  # is offline-mode. This keeps old online-mode player data, but it cannot prove
  # the player owns that premium account. Players still need /login or /register.
  rewrite-uuid-from-premium-name: false
  block-unverified-premium-names: false
  lookup-timeout-ms: 2500
  lookup-cache-minutes: 60
  fail-closed-on-lookup-error: false

security:
  password-min-length: 6
  password-hash-iterations: 120000
  login-timeout-seconds: 60
  max-login-attempts: 5
  allow-session-reconnect: false
  session-reconnect-minutes: 10

anti-bot:
  invalid-name-kick: true
  min-seconds-between-connections: 1
  max-connections-per-ip-per-minute: 8
  temp-ban-seconds: 120
  captcha-mode: suspicious # off, always, suspicious
  captcha-connections-per-ip-per-minute: 3
  captcha-global-connections-per-10s: 20
  max-failed-logins-per-ip: 8
  failed-login-window-seconds: 300

